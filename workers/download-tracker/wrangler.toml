name = "mmconsensus-download-tracker"
main = "src/index.js"
compatibility_date = "2026-11-20"
workers_dev = true
account_id = "ac575a9b822bea2bed97d0ab73aed238"

# Placeholder id. Before deploy, create a NEW KV namespace titled
# MMCONSENSUS_DOWNLOADS and replace this id. Do not reuse another
# product's namespace id. This pull request does not provision KV and
# does not deploy (Remain-OFF; Cap-7 ≠ ICANN; paid sat HELD).
# Local tests simulate DOWNLOADS and do not need the live id.
[[kv_namespaces]]
binding = "DOWNLOADS"
id = "00000000000000000000000000000000"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/download", "/download/*", "/stats", "/event", "/go", "/count", "/install.sh", "/v1", "/v1/*", "/openapi.json", "/mcp", "/mcp/", "/cite.json", "/sitemap.xml", "/robots.txt", "/llms.txt", "/ai.txt"]

[vars]
AZIEL_RUNTIME_ORIGIN = "https://aziel-runtime.vibelock.workers.dev"

# Optional on deploy: service binding to aziel-runtime. The proxy falls
# back to fetch(AZIEL_RUNTIME_ORIGIN) when the binding is absent.
# GET /v1/mesh/* proxies and does not enable mesh.
[[services]]
binding = "AZIEL_RUNTIME"
service = "aziel-runtime"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1
